name: Publish package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release metadata
        if: github.event_name == 'push'
        run: python tools/prepare_release.py "${GITHUB_REF_NAME}"

      - name: Prepare TestPyPI release metadata
        if: github.event_name == 'workflow_dispatch'
        run: python tools/prepare_release.py

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload release bundle
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to ${{ github.event_name == 'workflow_dispatch' && 'TestPyPI' || 'PyPI' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
      url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/p/cima-d3tools' || 'https://pypi.org/p/cima-d3tools' }}
    permissions:
      id-token: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Create release and attach distributions
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
