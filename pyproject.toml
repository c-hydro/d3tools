[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cima-d3tools"
version = "3.0.0"
description = "A package of common tools for the door, dam and dryes packages of CIMA Research Foundation"
authors = [
    { name = "Luca Trotter", email = "luca.trotter@cimafoundation.org" }
]
license = "EUPL-1.2"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# mandatory dependencies for basic functionality
dependencies = [
    "numpy~=2.3.5",
    "python_dateutil>=2.8.1",
    "rioxarray~=0.20.0",
    "rasterio~=1.4.0",
    "xarray~=2025.11.0",
    "dask~=2025.11.0",
    "h5netcdf~=1.7.3",
    "pandas~=2.3.3",
    "geopandas~=1.1.1",
]

[project.scripts]
d3run = "d3tools.cli:main"

[project.urls]
Repository = "https://github.com/c-hydro/d3tools"
Documentation = "https://c-hydro.github.io/d3tools/"
Changelog = "https://github.com/c-hydro/d3tools/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# dependencies for using csv and parquet files and shapefiles
more-data = [
    "pyarrow~=20.0.0",
    "fastparquet~=2024.11.0",
]

# dependencies for creating thumbnails
thumbnails = [
    "matplotlib~=3.10.3",
    "img2pdf~=0.5.1",
    "geopandas~=1.1.1",
    "Pillow~=10.0.0"
]

# dependencies for reading and writing remote data
remote-data = [
    "paramiko~=4.0.0",
    "boto3~=1.42.2",
    "requests~=2.32.3"
]

# pinned toolchain for building the documentation site
docs = [
    "zensical==0.1.3",
    "mkdocstrings-python==2.0.9",
]

# dependencies for running the repository test suite
test = [
    "pytest~=9.0.3",
]
